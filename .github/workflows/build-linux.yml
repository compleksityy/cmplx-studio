name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win nsis
            e2e: npm run test:e2e
            ollama: npm run test:ollama
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          # Pin the Linux builder to ubuntu-22.04: electron-builder's bundled
          # fpm 1.9.3 is incompatible with the rpmbuild shipped on modern
          # ubuntu-latest (rpm 6.x), which breaks the .rpm build with
          # "File not found .../BUILDROOT". Ubuntu 22.04 ships rpm 4.16 whose
          # build layout matches fpm 1.9.3.
          - os: ubuntu-22.04
            builder: --linux AppImage deb rpm
            e2e: xvfb-run -a npm run test:e2e:ci
            ollama: xvfb-run -a npm run test:ollama:ci
            artifacts: |
              release/*.AppImage
              release/*.AppImage.blockmap
              release/*.deb
              release/*.rpm
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies (deb + rpm + AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libarchive-tools || true

      - name: Install Xvfb (virtual display for headless Electron E2E)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Rebuild native module for Electron ABI (node-pty)
        run: npm run rebuild

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: ${{ matrix.e2e }}

      - name: Ollama integration tests (mock server)
        run: ${{ matrix.ollama }}

      - name: Build application
        run: npm run build

      - name: Package installer(s) for ${{ matrix.os }}
        run: npx electron-builder ${{ matrix.builder }}
        env:
          # Let electron-builder publish the built installers to a GitHub
          # Release automatically (onTagOrDraft) using the auto-provided
          # token. contents: write is granted at the top of this file.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows builds are not code-signed; avoid a signing step.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmplx-studio-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "version=$(grep -o '\"version\"[^,]*' package.json | head -1 | grep -o '[0-9.]*')" >> "$GITHUB_OUTPUT"

      - name: Finalize GitHub Release (name + auto release notes)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The installer binaries (.exe/.deb/.rpm/.AppImage) are already
          # published by the electron-builder step above (using GH_TOKEN).
          # This job only sets the final release name and generates notes, so
          # the same assets are not uploaded twice to the same release.
          name: CMPLX Studio ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false